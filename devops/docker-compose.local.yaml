services:
    tech-aquisitions-customers-rabbitmq-local:
        image: rabbitmq:4.2.0-management
        container_name: tech-aquisitions-customers-rabbitmq-local
        restart: unless-stopped
        ports:
            - "5671:5671"
            - "15671:15671"
        environment:
            RABBITMQ_CONFIG_FILE: "/etc/rabbitmq/rabbitmq.conf"
            RABBITMQ_LOAD_DEFINITIONS: "/etc/rabbitmq/definitions.json"
        volumes:
            - "./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf"
            - "./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json"
            - "./rabbitmq/ssl:/etc/rabbitmq/ssl"
            - tech-aquisitions-customers-rabbitmq-volume:/var/lib/rabbitmq
        mem_limit: 1024m
        cpus: 1.0
        networks:
            - tech-aquisitions-customers-network-local
    tech-aquisitions-customers-redis-local:
        image: redis:7-alpine
        container_name: tech-aquisitions-customers-redis-local
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - tech-aquisitions-customers-redis-volume:/data
        command: redis-server --appendonly yes
        mem_limit: 256m
        cpus: 0.5
        networks:
            - tech-aquisitions-customers-network-local
            - tech-aquisitions-customers-redis-local
    tech-aquisitions-customers-workers-service:
      build:
        context: ./..
        dockerfile: Workers.Dockerfile
      image: tech-aquisitions-customers-workers-service:local  
      restart: unless-stopped
      ports:
        - "8080:8080"
      environment:
        - ASPNETCORE_URLS=http://+:8080
      mem_limit: 80m
      cpus: 1.0
      depends_on:
        - tech-aquisitions-customers-rabbitmq-local
      networks:
        - tech-aquisitions-customers-network-local

networks:
  tech-aquisitions-customers-network-local:
    driver: bridge

volumes:
  tech-aquisitions-customers-rabbitmq-volume:
  tech-aquisitions-customers-redis-volume: